<!DOCTYPE html>
<html>
<head>
	<!--
	  If you are serving your web app in a path other than the root, change the
	  href value below to reflect the base path you are serving from.

	  The path provided below has to start and end with a slash "/" in order for
	  it to work correctly.

	  For more details:
	  * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

	  This is a placeholder for base href that will be replaced by the value of
	  the `--base-href` argument provided to `flutter build`.
	-->
	<base href="/Travel_app/">

	<meta charset="UTF-8">
	<meta content="IE=Edge" http-equiv="X-UA-Compatible">
	<meta name="description" content="A new Flutter project.">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<!-- iOS meta tags & icons -->
	<meta name="mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black">
	<meta name="apple-mobile-web-app-title" content="travel_web_app">
	<link rel="apple-touch-icon" href="icons/Icon-192.png">

	<!-- Favicon -->
	<link rel="icon" type="image/png" href="favicon.png"/>

	<title>travel_web_app</title>
	<link rel="manifest" href="manifest.json">

	<!-- Firebase SDK Script - Flutter보다 먼저 Firebase를 초기화하고 인증을 완료합니다. -->
	<script type="module">
		// Firebase 모듈 임포트
		import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
		import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
		import { getFirestore } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

		// Firestore 및 인증 로깅 레벨 설정 (디버깅용)
		setLogLevel('Debug');

		// 1. 전역 변수에서 Firebase 설정 및 App ID 가져오기
		let firebaseConfig, appId;
		let initialAuthToken;
		
		try {
			// 전역 변수는 문자열이므로 JSON.parse()로 객체로 변환해야 합니다.
			firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;
			appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
			initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
		} catch (e) {
			console.error("❌ [HTML] Firebase 전역 설정 변수 파싱 실패:", e);
			// 파싱 실패 시 초기화 시도 안함
			firebaseConfig = null;
		}

		// 비동기 초기화 및 인증 함수
		async function initializeFirebase() {
			if (!firebaseConfig) {
				console.error("❌ [HTML] Firebase 설정이 없어 초기화를 건너뛰고, Flutter에서 오류가 발생할 것입니다.");
				return;
			}
			
			try {
				// 2. Firebase 앱 초기화
				const app = initializeApp(firebaseConfig);
				const auth = getAuth(app);
				// Firestore 인스턴스도 미리 생성해 둡니다.
				const db = getFirestore(app); 

				console.log("✅ [HTML] Firebase App 초기화 성공. App ID:", appId);

				// 3. Custom Token 또는 익명 인증 시도
				if (initialAuthToken) {
					// Custom Token으로 로그인 시도
					await signInWithCustomToken(auth, initialAuthToken);
					console.log("🔑 [HTML] Custom Token으로 로그인 성공.");
				} else {
					// Custom Token이 없으면 익명으로 로그인 시도
					await signInAnonymously(auth);
					console.log("👤 [HTML] 익명 로그인 성공.");
				}

				// 인증 상태가 변경될 때마다 콘솔에 UID 로깅
				onAuthStateChanged(auth, (user) => {
					if (user) {
						console.log(`🙋 [HTML] 최종 인증 UID: ${user.uid}`);
					}
				});

			} catch (error) {
				// Firebase 초기화/인증 중 발생하는 모든 오류를 잡아 Flutter가 로드되기 전에 콘솔에 기록합니다.
				console.error("❌ [HTML] Firebase 초기화/인증에 치명적인 오류 발생. 이 오류가 Flutter의 실패로 이어질 수 있습니다:", error);
			}
		}

		// 웹 페이지 로드 시 초기화 시작 (Flutter보다 먼저 실행)
		window.onload = initializeFirebase;
	</script>
	<!-- Firebase SDK Script End -->

</head>
<body>
	<!-- Flutter 앱이 로드되는 컨테이너 -->
	<div id="flutter_container"></div>
	
	<!-- Flutter 부트스트랩 스크립트 -->
	<script src="flutter_bootstrap.js" async></script>
</body>
</html>
